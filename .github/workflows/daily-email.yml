name: Daily Email Reminder Cron

on:
  schedule:
    # UTC 00:00 等於台灣時間早上 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 Actions 頁面點擊按鈕手動測試

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Reminder Script
        env:
          EMAILJS_SERVICE_ID: ${{gYTMIU5nVqBIGi_7q}}
          EMAILJS_TEMPLATE_ID: ${{template_6dhzpy8}}
          EMAILJS_PUBLIC_KEY: ${{gYTMIU5nVqBIGi_7q}}
          EMAILJS_RECIPIENT: ${{12001@cyvs.tyc.edu.tw}}
        run: node send-reminders.js
