name: Daily Email Reminder Cron

on:
  schedule:
    # UTC 00:15 等於台灣時間早上 08:15（避開整點佇列塞車）
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Reminder Script
        env:
          EMAILJS_SERVICE_ID: 'service_ceeofp8'
          EMAILJS_TEMPLATE_ID: 'template_6dhzpy8'
          EMAILJS_PUBLIC_KEY: 'gYTMIU5nVqBIGi_7q'
          EMAILJS_RECIPIENT: '12001@cyvs.tyc.edu.tw'
        run: node send-reminders.js
